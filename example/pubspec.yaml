name: chatgpt_free_example
description: Minimal chat app on chatgpt_free.
publish_to: none
version: 1.0.0

environment:
  sdk: ^3.0.0

dependencies:
  flutter:
    sdk: flutter
  chatgpt_free:
    path: ../
  # Example-only: the package deliberately ships no URL launcher, so opening a
  # citation is the app's job. Adding it here proves the callback is usable
  # without pushing the dependency onto every consumer.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
