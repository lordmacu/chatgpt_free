name: chatgpt_free
description: Talk to ChatGPT from Flutter with no API key and no account, using the anonymous Android endpoint.
version: 0.1.3
repository: https://github.com/lordmacu/chatgpt_free
issue_tracker: https://github.com/lordmacu/chatgpt_free/issues

# pub.dev's own vocabulary — these are how the package is found by browsing
# rather than by name. Lowercase, hyphenated, max five.
topics:
  - chatgpt
  - ai
  - chat
  - llm
  - tool-calling

environment:
  sdk: ^3.0.0
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  uuid: ^4.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  # Required: this package's widgets use Material icons (MessageComposer's send
  # button). Without it Flutter does not bundle MaterialIcons-Regular.otf and
  # every Icons.* renders as a fallback glyph on device.
  uses-material-design: true
